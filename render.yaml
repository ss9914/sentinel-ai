envVarGroups:
  - name: sentinelai-shared
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true

services:
  - type: web
    name: ss9914-sentinelai-api
    runtime: docker
    region: singapore
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - fromGroup: sentinelai-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ss9914-sentinelai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ss9914-sentinelai-redis
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ss9914-sentinelai-web.onrender.com

  - type: worker
    name: ss9914-sentinelai-worker
    runtime: docker
    region: singapore
    dockerContext: ./backend
    dockerCommand: python -m app.workers.worker
    envVars:
      - fromGroup: sentinelai-shared
      - key: DATABASE_URL
        fromDatabase:
          name: ss9914-sentinelai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ss9914-sentinelai-redis
          property: connectionString

  - type: keyvalue
    name: ss9914-sentinelai-redis
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: ss9914-sentinelai-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://ss9914-sentinelai-api.onrender.com/api/v1
      - key: VITE_WS_URL
        value: wss://ss9914-sentinelai-api.onrender.com/api/v1/ws/alerts

databases:
  - name: ss9914-sentinelai-db
    region: singapore
    plan: free
    databaseName: sentinelai
    user: sentinelai
    ipAllowList: []
